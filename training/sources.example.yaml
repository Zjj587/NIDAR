# Paths are relative to this file. Choose distinct upstream scenes for each split.
recipe: historical-dense-v1
split_policy: scene-disjoint
stn_checkpoint: ../weights/stn/47.pth
exposure_ratio: 0.5
image_shape: [384, 960]
sources:
  - root: ../data/scene_train
    split: train
    cameras: [1, 2, 3, 4, 5, 6]
    # Used only by sparse-v1. Dense compatibility uses per-image percentiles.
    intensity_scale: 1.0
  - root: ../data/scene_val
    split: val
    cameras: [1, 2, 3, 4, 5, 6]
    intensity_scale: 1.0
