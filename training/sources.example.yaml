# Paths are relative to this file. Choose distinct upstream scenes for each split.
stn_checkpoint: ../weights/stn/47.pth
exposure_ratio: 0.5
image_shape: [384, 1248]
sources:
  - root: ../data/scene_train
    split: train
    cameras: [1, 2, 3, 4, 5, 6]
    # nuScenes exports are already divided by 255; do not divide again.
    intensity_scale: 1.0
  - root: ../data/scene_val
    split: val
    cameras: [1, 2, 3, 4, 5, 6]
    intensity_scale: 1.0
